; CYD Pocket OS - ESP32-2432S028 / 320x240
; Build:  python -m platformio run
; Flash:  python -m platformio run -t upload --upload-port COM6
;
; Bad Apple frames live on the SD card (/badapple.txt); no animation data is
; compiled into the application, so the firmware stays inside the app
; partition even on a 4 MB board.

[platformio]
src_dir = CYD_Pocket_OS
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

build_unflags = -Os
build_flags =
    -O2
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_extra_dirs = lib
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
